<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Shooter Elite V2</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #03030f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 22px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00ffff;
            color: #00ffff;
        }
        #gameWrapper {
            position: relative;
        }
        #gameCanvas {
            border: 3px solid #00ffff;
            background-color: #010105;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            max-width: 95vw;
            max-height: 72vh;
            border-radius: 12px;
        }
        .instructions {
            margin: 8px 0;
            font-size: 13px;
            color: #88aaee;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>METEOR SMASHER</h1>
    <div id="gameWrapper">
        <canvas id="gameCanvas" width="360" height="540"></canvas>
    </div>
    <div class="instructions">Left Side Drag: Move ship | Right Side Tap: Shoot Lasers<br>Featuring custom shapes and haptic impacts!</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameOver = false;
        let score = 0;
        let speedMultiplier = 1;
        let screenShakeIntensity = 0;

        // Player Space Interceptor
        const player = {
            x: canvas.width / 2 - 16,
            y: canvas.height - 80,
            width: 32,
            height: 32,
            color: "#00ffff"
        };

        // Engine Tracking Registers
        const obstacles = [];
        const lasers = [];
        const particles = [];
        const obstacleSpawnRate = 32; 
        let spawnTimer = 0;
        let lastTouchX = null;

        // --- DEVICE HAPTIC MOTOR TRIGGERS ---
        function triggerHaptic(duration) {
            if ("vibrate" in navigator) {
                navigator.vibrate(duration);
            }
        }

        // --- RELATIVE STEERING INTERFACE ENGINE ---
        canvas.addEventListener("touchstart", (e) => {
            if (gameOver) {
                resetGame();
                return;
            }
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const touchCanvasX = ((touch.clientX - rect.left) / rect.width) * canvas.width;

                if (touchCanvasX < canvas.width / 2) {
                    lastTouchX = touchCanvasX;
                } else {
                    fireLaser();
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                const touchCanvasX = ((touch.clientX - rect.left) / rect.width) * canvas.width;

                if (touchCanvasX < canvas.width / 2 && lastTouchX !== null) {
                    const deltaX = touchCanvasX - lastTouchX;
                    player.x += deltaX * 1.6;
                    lastTouchX = touchCanvasX;

                    if (player.x < 0) player.x = 0;
                    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
                }
            }
        }, { passive: false });

        canvas.addEventListener("touchend", (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const rect = canvas.getBoundingClientRect();
                const touchCanvasX = ((touch.clientX - rect.left) / rect.width) * canvas.width;
                if (touchCanvasX < canvas.width / 2) lastTouchX = null;
            }
        });

        function fireLaser() {
            triggerHaptic(12); // Short pulse weapon discharge
            lasers.push({
                x: player.x + player.width / 2 - 2, 
                y: player.y,
                width: 4,
                height: 16,
                speed: 12,
                color: "#ff00ff"
            });
        }

        // --- COMPLEX EXPLOSION GENERATION ---
        function createExplosion(x, y, color, count = 12) {
            screenShakeIntensity = Math.min(screenShakeIntensity + count * 0.4, 15);
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 4 + 2,
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.02,
                    color: color
                });
            }
        }

        // --- POLYGON SHAPE DRAWING FUNCTION ---
        function drawPolygon(x, y, radius, sides, flash) {
            if (sides < 3) return;
            ctx.beginPath();
            ctx.moveTo(x + radius * Math.cos(0), y + radius * Math.sin(0));
            for (let i = 1; i <= sides; i++) {
                ctx.lineTo(x + radius * Math.cos(i * 2 * Math.PI / sides), y + radius * Math.sin(i * 2 * Math.PI / sides));
            }
            ctx.closePath();
            ctx.fill();
        }

        function spawnObstacle() {
            const roll = Math.random();
            let radius, hp, speedOffset, color, points, sides;

            if (roll < 0.50) {
                // Triangle: Swift Interceptor Fragment
                radius = 12; hp = 1; speedOffset = 3.8; color = "#ff5555"; points = 1; sides = 3;
            } else if (roll < 0.85) {
                // Pentagon: Standard Core Rock
                radius = 20; hp = 2; speedOffset = 2.4; color = "#ffaa00"; points = 3; sides = 5;
            } else {
                // Octagon: Ultra Dense Heavy Mass
                radius = 32; hp = 5; speedOffset = 1.3; color = "#dd00ee"; points = 10; sides = 8;
            }

            obstacles.push({
                x: Math.random() * (canvas.width - radius * 2) + radius,
                y: -radius * 2,
                radius: radius,
                maxHp: hp,
                currentHp: hp,
                speed: speedOffset * speedMultiplier,
                color: color,
                points: points,
                sides: sides,
                flashFrames: 0
            });
        }

        function resetGame() {
            obstacles.length = 0;
            lasers.length = 0;
            particles.length = 0;
            score = 0;
            speedMultiplier = 1;
            player.x = canvas.width / 2 - 16;
            lastTouchX = null;
            gameOver = false;
            animate();
        }

        function animate() {
            if (gameOver) {
                ctx.fillStyle = "rgba(5, 5, 15, 0.95)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#ff3366";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("SYSTEM CRASHED", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.fillStyle = "white";
                ctx.font = "18px sans-serif";
                ctx.fillText(`Combat Assets Reclaimed: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                
                ctx.fillStyle = "#00ffff";
                ctx.font = "14px sans-serif";
                ctx.fillText("TAP SCREEN TO DEPLOY NEW HULL", canvas.width / 2, canvas.height / 2 + 75);
                return;
            }

            // --- CANVAS RENDER MATRIX SHAKE EFFECT ---
            ctx.save();
            if (screenShakeIntensity > 0) {
                const dx = (Math.random() - 0.5) * screenShakeIntensity;
                const dy = (Math.random() - 0.5) * screenShakeIntensity;
                ctx.translate(dx, dy);
                screenShakeIntensity *= 0.9; // Fast drop-off dampening
                if (screenShakeIntensity < 0.2) screenShakeIntensity = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Process Flying Debris Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;

            // 2. Transmit Heavy Plasma Weapons
            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                l.y -= l.speed;
                ctx.fillStyle = l.color;
